# =============================================================================
# Tool Catalog Integration
# =============================================================================
# Fetches tools from an external API for use in A/B tests.
arcade:
  enabled: false
  api_url: "https://api.arcade.dev"
  api_key: ""
  fetch_interval_seconds: 300
